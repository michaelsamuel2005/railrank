[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railrank"
version = "1.0.0"
description = "A rail journey ranking service: a learning-to-rank model trained on position-debiased clicks, served from a container under a latency budget, with a promotion gate that can refuse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Samuel" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "xgboost>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "mlflow>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
railrank-train = "railrank.train:main"
railrank-score = "railrank.evaluate:main"

[tool.setuptools.packages.find]
include = ["railrank*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
